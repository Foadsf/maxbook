<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maxbook</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/mathlive/mathlive-fonts.css">
<link rel="stylesheet" href="vendor/mathlive/mathlive-static.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="icon.svg" alt=""><b>Maxbook</b></div>
  <input id="title" class="doc-title" aria-label="Notebook title" spellcheck="false">
  <span id="dirty" class="dirty-dot" title="Unsaved changes" hidden></span>
  <div class="spacer"></div>
  <div class="tb-group">
    <button class="btn" data-cmd="new" title="New notebook (Ctrl+Alt+N)"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15h6"/></svg><span class="lbl">New</span></button>
    <button class="btn" data-cmd="open" title="Open or import (Ctrl+O)"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lbl">Open</span></button>
    <button class="btn" data-cmd="save" title="Save (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3M7 21v-7h10v7"/></svg><span class="lbl">Save</span></button>
    <button class="btn" data-cmd="export" title="Export (LaTeX, HTML, Markdown, Maxima, wxMaxima)"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="lbl">Export</span></button>
  </div>
  <div class="tb-group">
    <button class="btn primary" data-cmd="run-all" title="Run all cells (Ctrl+Shift+Enter)"><svg viewBox="0 0 24 24"><path d="M6 4l12 8-12 8z" fill="currentColor"/></svg><span class="lbl">Run all</span></button>
    <button class="btn" data-cmd="interrupt" title="Stop the computation (restarts Maxima)"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span class="lbl">Stop</span></button>
    <button class="btn" data-cmd="restart" title="Restart Maxima (clears all definitions)"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
  </div>
  <div class="tb-group">
    <span id="kernel" class="kernel-pill" data-status="starting" title="Maxima"><i></i><span>Starting Maxima…</span></span>
    <button class="btn" data-cmd="palette" title="Search commands and templates (Ctrl+K)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="btn" data-cmd="theme" title="Light / dark"><svg viewBox="0 0 24 24"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button>
    <button class="btn" data-cmd="help" title="Keyboard shortcuts (F1)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 1-1 1.7M12 17h.01"/></svg></button>
  </div>
</header>
<div id="layout" class="layout">
  <nav class="side" aria-label="Outline">
    <h3>Outline</h3>
    <div id="outline" class="outline"></div>
    <div class="recent"><h3>Recent</h3><div id="recent"></div></div>
  </nav>
  <main id="main" class="main">
    <div id="banner" class="banner" hidden></div>
    <article id="paper" class="paper"></article>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
</body>
</html>
