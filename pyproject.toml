[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "maxbook"
version = "0.5.0"
description = "Literate notebooks for the Maxima computer algebra system"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Foad S. Farimani" }]
keywords = ["maxima", "computer algebra", "notebook", "literate programming", "mathematics"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Development Status :: 3 - Alpha",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Foadsf/maxbook"
Issues = "https://github.com/Foadsf/maxbook/issues"

[project.optional-dependencies]
desktop = ["pywebview>=5"]
ai = ["anthropic>=1.14"]
dev = ["pytest>=7", "ruff"]

[project.scripts]
maxbook = "maxbook.cli:main"

[tool.setuptools]
packages = ["maxbook"]

[tool.setuptools.package-data]
maxbook = ["lisp/*", "web/*", "web/css/*", "web/js/*", "web/vendor/mathlive/*",
           "web/vendor/mathlive/fonts/*", "web/vendor/prosemirror/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "BLE", "RUF"]
# readability over terseness: plain try/except, if/else blocks, list concatenation,
# and Windows' own environment variable spelling are fine here
ignore = ["SIM105", "SIM108", "SIM112", "SIM114", "RUF005"]

[tool.ruff.lint.per-file-ignores]
# the LaTeX exporter's character table and its test are about look-alike characters
"maxbook/formats.py" = ["RUF001"]
"tests/test_formats.py" = ["RUF001"]
